name: release-please

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
      - README.md
      - INSTALL_MANIFEST.md
      - .github/workflows/release-please.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          skip-github-pull-request: true
