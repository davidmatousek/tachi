# =============================================================================
# tachi install fidelity — manifest completeness guard (Feature 373, A-1,
#   the W1 cut line: K1/K2 ship every skill and script)
# =============================================================================
#
# Purpose: Fail the build when INSTALL_MANIFEST.md drifts from what an
# adopter actually needs — a missing skill, agent, command or distributable
# script; a manifest hygiene break; a non-stdlib import reaching a
# distributable script at module load (S-13); or a manual-install loop that
# no longer matches, byte-for-byte, across README.md and the developer
# guide. This is the K1/K2 guard (FR-K2.2-K2.5): every skill and script
# ships, and CI catches drift before it reaches an adopter's `install.sh`
# run or copy-paste loop.
#
# This is the W1 cut-line commit (A-1, PD-9, PD-20): the ONLY job this
# workflow runs today is `manifest-completeness`, gating only
# tests/scripts/test_install_manifest_completeness.py. Nothing else may
# redden this commit's run (RC-P1) — the pre-existing extraction modules
# are red on bare ubuntu until PD-8's mmdc-skip fixture lands, so they join
# in their own wiring commit, A-2 (the `extraction-fidelity` job),
# immediately after this one is green and before any Lane B1 commit. A-3
# (the K14 static contract test) joins `extraction-fidelity` later in W1.
# A `report-posture` job (Typst-gated, `setup-typst@v5`) joins in W2, only
# if the K13-posture carve unit ships.
#
# Dual trigger (PR + push:[main]): a manifest or install.sh edit can reach
# main via a direct push that bypasses the pull_request trigger — the same
# direct-to-main bypass issue #338 exploited once before. Both triggers
# resolve a SINGLE path list via a YAML anchor (&fidelity_paths /
# *fidelity_paths), cloned from tachi-catalog-drift.yml's dual-trigger,
# single-anchor pattern so there is no second list to drift out of sync.
#
# F-250 lock-step rule: any change to this module's dependency surface MUST
# update BOTH the `paths:` anchor below AND the pytest invocation in the
# same commit. PD-20 assigns this workflow file to Lane A alone, in every
# wave, and each module's author-lane wiring commit bundles the module with
# its paths and invocation entry so the module is never ungated.
#
# F-374 (ADR-050 D16): three jobs run the offline modules of PR 1 and PR 2 on
# synthetic fixtures, with no model, no network and no Typst. W1 wired the
# first modules, W2 added test_tachi_scoring_rules.py and
# test_render_risk_scores.py, and W3 (T039) added
# test_render_compensating_controls.py. PR 2's W2' (T114) adds
# test_threats_md_join.py, test_threats_sarif.py, test_chain_script.py and
# test_report_assembly.py. PR 2's W3' adds test_threat_model_checks.py.
#   - f374-offline (ubuntu-latest, Python 3.11) runs the module list under
#     pytest-cov. Its first step is the coverage gate: at least 80% line
#     coverage over the new scripts, counting in-process runs only
#     (tests/scripts/coverage-f374.ini, H15). Its second is the ratchet that
#     holds tachi_parsers.py to the floor T001 measured (E3).
#   - f374-py39-floor (ubuntu-24.04, Python 3.9) runs the same list without
#     coverage, so a shipped script or its tests can't use a later API (S-11,
#     #396). 3.9 is pinned to an image that has it.
#   - f374-macos (macos-latest, Python 3.11) runs test_sarif_identity.py alone,
#     because its case-insensitive-volume case needs a real one (D7, KB 24).
#     From W2 that module also drives render-risk-scores.py, on the project
#     harness of test_render_risk_scores.py (FR-E.2's two-run model), so a
#     change to either module, the renderer or the planner reruns this job.
#     From W3 it drives render-compensating-controls.py too, on the same
#     harness (the controls stage reads the scorer's run), so a change to the
#     controls renderer reruns this job as well. From PR 2 (T099) it drives
#     generate-threats-sarif.py as well, on the project of
#     test_threats_sarif.py, so a change to the generator or to that module
#     reruns this job too.
# Lock-step (KB 3, H7): a module, its input surfaces, its `paths:` entries and
# its invocation line in each f374 job that runs it land in one commit. The two
# module lists are one list, except that f374-offline also runs
# test_sarif_common_affected_assets.py, so that sarif_common.py's coverage
# counts that module's tests.
#
# References:
#   - specs/373-adopter-install-output-fidelity/contracts/manifest-completeness.md
#     § Workflow wiring for this module
#   - specs/373-adopter-install-output-fidelity/research.md PD-8, PD-9, PD-20
#   - specs/373-adopter-install-output-fidelity/plan.md
#     § Lane and file ownership per wave: test modules and CI files
#   - tests/scripts/test_install_manifest_completeness.py
# =============================================================================

name: tachi install fidelity

on:
  pull_request:
    paths: &fidelity_paths
      - INSTALL_MANIFEST.md
      - .claude/skills/**
      - .claude/commands/tachi.*.md
      - .claude/agents/tachi/**
      - templates/tachi/**
      - brand/**                                       # T036 L-8 — manifest directory entry
      - schemas/**                                     # T036 L-8 — manifest directory entry (widens schemas/taxonomy/*.yaml below)
      - scripts/*.py
      - scripts/install.sh
      - README.md
      - docs/guides/DEVELOPER_GUIDE_TACHI.md
      - tests/scripts/test_install_manifest_completeness.py
      - tests/conftest.py
      - tests/scripts/conftest.py
      - pyproject.toml
      - .github/workflows/tachi-install-fidelity.yml
      # --- A-2: the pre-existing extraction modules' own surfaces. The
      #     extractors and tachi_parsers.py are already covered by
      #     scripts/*.py above ---
      - examples/**                                  # N3
      - tests/scripts/fixtures/exec_arch/**           # N3
      - tests/scripts/fixtures/golden/**              # N3
      - tests/scripts/fixtures/report_data/**         # C-1 — test_extract_report_data.py:24
      - tests/scripts/fixtures/fidelity_373/**        # C-1 — first read by test_tachi_parsers.py
      - schemas/taxonomy/*.yaml                       # OQ-5 — extract-report-data.py:2328-2331
      - tests/scripts/test_tachi_parsers.py
      - tests/scripts/test_extract_infographic_data.py
      - tests/scripts/test_extract_report_data.py
      - tests/scripts/test_extractor_contract_fixes.py
      - tests/scripts/test_executive_architecture_payload.py
      # --- A-3: the K14 static request contract test ---
      - tests/scripts/test_gemini_request_contract.py
      - adapters/claude-code/**                       # A-3, N3/RC-P5 — A4/A6 pin the shipped adapter copy
      # --- W2: the sibling-parity module. Its fixture trees are already
      #     covered by report_data/** and fidelity_373/** since A-2 (C-1) ---
      - tests/scripts/test_extraction_sibling_parity.py
      # --- W2: K13-posture (report-posture job). Stand-alone: dropped
      #     together with its module in the job's pytest line if K13-posture
      #     is carved (PD-8) ---
      - templates/tachi/security-report/**
      - tests/scripts/test_report_posture_contract.py
      # --- F-391 (T015): write confinement of the report build path. Runs
      #     in the report-posture job (Typst-gated). Its other inputs already
      #     match entries above: scripts/*.py (the extractor and
      #     tachi_parsers.py), schemas/**, templates/tachi/**,
      #     tests/scripts/fixtures/fidelity_373/** (posture_mmdc_free) and
      #     the five recipe documents it scans (.claude/agents/tachi/**,
      #     .claude/commands/tachi.*.md, .claude/skills/**) ---
      - tests/scripts/test_write_confinement.py       # F-391 (T015) — AR-1, SC-005
      # --- F-391 (T028): new cases in test_install_manifest_completeness.py,
      #     run by manifest-completeness: the runbook's manifest entries and
      #     SC-A4 (the installed agents' tools equal section 8 of the
      #     matrix). They read two files no entry above covers, listed below.
      #     The guard script whose parsers they load matches scripts/*.py,
      #     and the agents they compare match .claude/agents/tachi/** ---
      - docs/standards/CLAUDE_PERMISSIONS.md          # F-391 (T028) — SC-A4: section 8, expected tools
      - docs/guides/ISOLATED_OPERATION_TACHI.md       # F-391 (T028) — FR-011a: the installed runbook
      # --- F-374 (T022, ADR-050 D16): W1's modules for the three f374 jobs.
      #     Their scripts (tachi_parts.py, tachi_scoring.py, sarif_common.py,
      #     tachi-stage.py, tachi_parsers.py, populate-affected-assets.py) match
      #     scripts/*.py above. So do the schemas (schemas/**), the skills
      #     (reachability-analysis.md among them), agents, commands and adapters
      #     that test_contract_text_374.py and test_cvss_category_defaults.py
      #     read, the two conftest files and test_tachi_parsers.py. These are
      #     the entries nothing above covers.
      #     W2 (T047) adds the renderer and its rules module, which also match
      #     scripts/*.py, and the surfaces they read: the output templates the
      #     renderer's goldens compare (templates/tachi/**) and the shipped
      #     examples (examples/**: test_tachi_scoring_rules.py reads each
      #     sample's risk-scores.md, and test_sarif_identity.py, which
      #     f374-macos runs alone, reads every examples/**/*.sarif).
      #     W3 (T039) adds the controls renderer, which also matches
      #     scripts/*.py, and its test module, which reads the same output
      #     templates and imports helpers from test_render_risk_scores.py.
      #     W2' (T114) adds PR 2's four entries, which match scripts/*.py,
      #     and their four test modules. Those read only inputs that an entry
      #     above already covers: the output templates (templates/tachi/**),
      #     skill references (.claude/skills/**), the shipped examples
      #     (examples/**) and the large_arch fixtures. The write confinement
      #     suite (report-posture) imports the run builders of three of them,
      #     and each module needs an entry of its own anyway.
      #     test_contract_text_374.py also reads two files that no glob above
      #     covers: ADR-050's text (the completion rule, the end marker's
      #     words and its recorded frame) and the records contract (the
      #     recorded frame and the class table).
      #     Only the four new test modules and those two files need an entry ---
      - tests/scripts/test_tachi_parts.py
      - tests/scripts/test_tachi_stage.py
      - tests/scripts/test_runtime_floor_374.py
      - tests/scripts/test_sarif_identity.py
      - tests/scripts/test_fixture_374.py
      - tests/scripts/test_contract_text_374.py
      - tests/scripts/test_cvss_category_defaults.py
      - tests/scripts/test_sarif_common_affected_assets.py
      - tests/scripts/test_tachi_scoring_rules.py     # F-374 (T047) — tachi_scoring_rules.py's goldens (W2)
      - tests/scripts/test_render_risk_scores.py      # F-374 (T047) — render-risk-scores.py's goldens (W2); test_sarif_identity.py imports its harness
      - tests/scripts/test_render_compensating_controls.py   # F-374 (T039) — render-compensating-controls.py's goldens (W3); imports test_render_risk_scores.py's helpers
      - tests/scripts/test_threats_md_join.py         # F-374 (T114) — join-threats-md.py's goldens (W2'); imports the two renderers' helpers; test_write_confinement.py imports its run builder
      - tests/scripts/test_threats_sarif.py           # F-374 (T114) — generate-threats-sarif.py's goldens (W2'); imports test_render_risk_scores.py and test_sarif_identity.py, and test_sarif_identity.py imports its project
      - tests/scripts/test_chain_script.py            # F-374 (T114) — attack-chains.py's goldens (W2'); test_write_confinement.py imports its run builder
      - tests/scripts/test_report_assembly.py         # F-374 (T114) — assemble-report.py's goldens (W2'); test_write_confinement.py imports its run builder
      - docs/architecture/02_ADRs/ADR-050-large-architecture-output-authority.md   # F-374 (T114) — test_contract_text_374.py reads the completion rule and the end marker's words (input)
      - specs/374-large-architecture-pipeline-resilience/contracts/threat-model-records.md   # F-374 (T114) — test_contract_text_374.py reads the recorded frame and the class table (input)
      - tests/scripts/generate_large_arch_fixture.py  # F-374 (T020) — the fixture generator test_fixture_374.py drives
      - tests/scripts/fixtures/large_arch/**          # F-374 (T019) — the synthetic large-architecture fixture (S-4)
      - tests/scripts/coverage-f374.ini               # F-374 (D16) — the coverage gate's config
  push:
    branches: [main]
    paths: *fidelity_paths

permissions:
  contents: read

jobs:
  manifest-completeness:
    name: manifest-completeness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest + pytest-timeout + PyYAML
        run: pip install 'pytest>=8' 'pytest-timeout>=2' 'pyyaml>=6'

      - name: Run manifest completeness suite (K1/K2 guard)
        run: |
          python3 -m pytest tests/scripts/test_install_manifest_completeness.py -v

  extraction-fidelity:
    name: extraction-fidelity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest + pytest-timeout + PyYAML
        run: pip install 'pytest>=8' 'pytest-timeout>=2' 'pyyaml>=6'

      # A-2 (PD-8, PD-9, PD-20): the pre-existing extraction modules, gated
      # for the first time on bare ubuntu. The R-3 safety net. mmdc is not
      # installed on this runner, so the five image-flag cases in
      # test_extract_report_data.py's agentic_app_report_typst fixture skip
      # (PD-8) rather than fail; every other case in these five modules
      # must pass. No Typst, no mmdc — the report-posture job (Typst-gated)
      # joins separately in W2, only if K13-posture ships.
      # A-3: the K14 static request contract test (A1-A8, PD-13/PD-14) joins
      # here. It asserts the reference body, the five template configuration
      # blocks, the executive-architecture block and the adapter copy never
      # drift from contracts/gemini-request-and-scaffold.md, with no network
      # call and no live key.
      # W2 (T019): the sibling-parity module compares posture, severity
      # counts, delta counts and MAESTRO output between the infographic
      # JSON and report-data.typ on the same fixtures, including the K11
      # join-path case (F2).
      - name: Run extraction-fidelity suite (R-3 safety net)
        run: |
          python3 -m pytest \
            tests/scripts/test_tachi_parsers.py \
            tests/scripts/test_extract_infographic_data.py \
            tests/scripts/test_extract_report_data.py \
            tests/scripts/test_extractor_contract_fixes.py \
            tests/scripts/test_executive_architecture_payload.py \
            tests/scripts/test_gemini_request_contract.py \
            tests/scripts/test_extraction_sibling_parity.py \
            -v

  # W2, K13-posture (PD-8) plus F-391 T015: this job is Typst-gated and runs
  # two modules in one pytest session: the K13-posture stale-data gate
  # (test_report_posture_contract.py) and the F-391 write-confinement suite
  # (test_write_confinement.py). If K13-posture is ever carved, drop its
  # module from the invocation below and its paths: entries above; the job
  # stays for the F-391 suite, and the revert stays mechanical. Typst comes
  # from typst-community/setup-typst@v5, unpinned to a compiler version,
  # mirroring tachi-mmdc-preflight.yml's precedent. TACHI_REQUIRE_TYPST=1
  # makes the stale-data test and the write-confinement tests that compile
  # fail (not skip) when Typst is missing; the rest of the write-confinement
  # suite needs no Typst.
  report-posture:
    name: report-posture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TACHI_REQUIRE_TYPST: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Typst
        uses: typst-community/setup-typst@v5

      - name: Install pytest + pytest-timeout + PyYAML
        run: pip install 'pytest>=8' 'pytest-timeout>=2' 'pyyaml>=6'

      # One pytest session for both modules, so a failure in one cannot hide
      # the other. test_write_confinement.py runs the three report-assembler
      # commands (extract --build-dir, typst compile, extract
      # --remove-build-dir) in a throwaway adopter project and fails on any
      # write outside {out} and $TMPDIR (F-391 T015, SC-005). From F-374 it
      # also runs each of PR 1's and PR 2's installed entries in a project of
      # its own, with the same check (ADR-050 D16). PR 2's groups build their
      # synthetic runs with the builders of test_threats_md_join.py,
      # test_chain_script.py and test_report_assembly.py, which need only
      # what is installed here. Keep both modules here in lock-step with the
      # `paths:` list above (F-250 rule).
      - name: Run report-posture suite (K13 stale-data gate + F-391 write confinement)
        run: |
          python3 -m pytest \
            tests/scripts/test_report_posture_contract.py \
            tests/scripts/test_write_confinement.py \
            -v

  # F-374 (T022, T047, T039, T114, ADR-050 D16), W1 to W3 and PR 2's W2': the offline modules of both PRs on synthetic
  # fixtures. This job and f374-py39-floor run one module list, except that this job also runs
  # test_sarif_common_affected_assets.py, so that sarif_common.py's coverage counts that module's tests. pytest-cov is
  # a test dependency only: the shipped scripts stay stdlib-only (NFR-2). Keep the list in lock-step with the `paths:`
  # list above (F-250 rule, H7).
  f374-offline:
    name: f374-offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest + pytest-timeout + PyYAML + pytest-cov
        run: pip install 'pytest>=8' 'pytest-timeout>=2' 'pyyaml>=6' 'pytest-cov>=4.1'

      # The coverage gate. tests/scripts/coverage-f374.ini lists the gated scripts in `include` and sets
      # `fail_under = 80`, so a set below 80% total line coverage fails this step. Gated tests drive each entry
      # in-process through main(argv), because a subprocess run doesn't count (H15).
      - name: Run the F-374 suite with the coverage gate (ADR-050 D16)
        run: |
          python3 -m pytest \
            --cov --cov-config=tests/scripts/coverage-f374.ini --cov-report=term-missing \
            tests/scripts/test_tachi_parts.py \
            tests/scripts/test_tachi_stage.py \
            tests/scripts/test_tachi_scoring_rules.py \
            tests/scripts/test_render_risk_scores.py \
            tests/scripts/test_render_compensating_controls.py \
            tests/scripts/test_threats_md_join.py \
            tests/scripts/test_threats_sarif.py \
            tests/scripts/test_chain_script.py \
            tests/scripts/test_report_assembly.py \
            tests/scripts/test_runtime_floor_374.py \
            tests/scripts/test_tachi_parsers.py \
            tests/scripts/test_sarif_identity.py \
            tests/scripts/test_fixture_374.py \
            tests/scripts/test_contract_text_374.py \
            tests/scripts/test_cvss_category_defaults.py \
            tests/scripts/test_sarif_common_affected_assets.py \
            -v

      # The ratchet (E3). tachi_parsers.py is extended, not new, and its legacy code would set most of its figure,
      # so it is held to the floor that T001 measured (specs/374-large-architecture-pipeline-resilience/
      # test-results/prestate.md, section 7) instead of 80%. The floor and this check count the same tests,
      # tests/scripts/test_tachi_parsers.py, so each new parser function's unit tests go there. The floor is never
      # lowered within the bundle. coverage rounds the total to the threshold's decimals, so 44.9 tolerates about
      # one extra uncovered statement.
      - name: Check tachi_parsers.py's coverage ratchet (ADR-050 D16, E3)
        run: |
          python3 -m pytest --cov=scripts --cov-report= tests/scripts/test_tachi_parsers.py
          python3 -m coverage report --include=scripts/tachi_parsers.py --precision=1 --show-missing --fail-under=44.9

  # F-374 (T022, T047, T039, T114, ADR-050 D16), W1 to W3 and PR 2's W2': the Python 3.9 floor (S-11). The shipped
  # scripts run on 3.9 and later, so their tests run on 3.9 too. 3.9 is pinned to ubuntu-24.04, an image that has it
  # (#396). No coverage here: the gate runs once, in f374-offline. conftest.py imports PyYAML, so it is installed.
  f374-py39-floor:
    name: f374-py39-floor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install pytest + pytest-timeout + PyYAML
        run: pip install 'pytest>=8' 'pytest-timeout>=2' 'pyyaml>=6'

      - name: Run the F-374 suite on the Python 3.9 floor (S-11)
        run: |
          python3 -m pytest \
            tests/scripts/test_tachi_parts.py \
            tests/scripts/test_tachi_stage.py \
            tests/scripts/test_tachi_scoring_rules.py \
            tests/scripts/test_render_risk_scores.py \
            tests/scripts/test_render_compensating_controls.py \
            tests/scripts/test_threats_md_join.py \
            tests/scripts/test_threats_sarif.py \
            tests/scripts/test_chain_script.py \
            tests/scripts/test_report_assembly.py \
            tests/scripts/test_runtime_floor_374.py \
            tests/scripts/test_tachi_parsers.py \
            tests/scripts/test_sarif_identity.py \
            tests/scripts/test_fixture_374.py \
            tests/scripts/test_contract_text_374.py \
            tests/scripts/test_cvss_category_defaults.py \
            -v

  # F-374 (T022, T047, T039, T114, ADR-050 D16), W1 to W3 and PR 2's W2': the one module whose real
  # case-insensitive-volume case needs a macOS runner (D7, KB 24), because macOS is the platform most adopters use. The
  # other cases fake the filesystem and run on both Linux jobs above. From W2 the module also renders
  # risk-scores.sarif through the renderer (FR-E.2), from W3 compensating-controls.sarif through the controls
  # renderer, and from PR 2 threats.sarif through generate-threats-sarif.py (T099), so its inputs are the two
  # renderers, the generator, the planner, the helpers they import, and test_render_risk_scores.py and
  # test_threats_sarif.py, whose project harnesses it imports; each matches an entry in `paths:` above.
  f374-macos:
    name: f374-macos
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest + pytest-timeout + PyYAML
        run: pip install 'pytest>=8' 'pytest-timeout>=2' 'pyyaml>=6'

      - name: Run the SARIF identity suite on macOS (D7 case-insensitive volume)
        run: |
          python3 -m pytest tests/scripts/test_sarif_identity.py -v
