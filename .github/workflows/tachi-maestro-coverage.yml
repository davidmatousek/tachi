# =============================================================================
# tachi maestro coverage gate — MAESTRO 7-layer invariant (F-315 US-3 / #313)
#   + cross-surface coverage_state consistency (F-311 US-3 / #311)
# =============================================================================
#
# Purpose: Durably lock two MAESTRO guarantees on every PR that touches the
# MAESTRO author/parse surface:
#   1. (F-098/F-315) Every shipped example `threats.md` carrying a "Risk by
#      MAESTRO Layer" table presents ALL SEVEN canonical layers (L1-L7) as rows.
#   2. (F-311 Model B) The three rendering surfaces — threats.md §6, the PDF
#      `report-data.typ` IR, and the infographic `maestro-stack.json` IR — agree
#      on every layer's clean/n-a/findings `coverage_state` (ADR-047 FR-010/
#      FR-011, SC-001/SC-002). The consistency test re-extracts the PDF and
#      infographic render IR at test time and classifies the markdown cell with
#      the shared classifier, so any divergence fails NAMING the layer ID and the
#      divergent surface — self-explaining in the PR checks UI.
#
# Dedicated single-concern job (plan.md Decision A) — modeled on the
# tachi-mmdc-preflight.yml file precedent. Deliberately NOT folded into
# tachi-pytest.yml: that job is a bash-compatibility matrix (macOS + ubuntu)
# and broadening its tightly-scoped trigger would risk NFR-4 cross-firing.
# The invariant is a markdown-glob assertion — OS-independent, single runner.
#
# F-250 lock-step rule: any future addition to the MAESTRO test set or
# example-author surface MUST update BOTH the `paths:` list below AND the
# pytest invocation in the same commit.
#
# References:
#   - specs/315-maestro-output-completeness-round-2/plan.md (Decision A + E)
#   - specs/315-maestro-output-completeness-round-2/contracts/tachi-maestro-coverage-ci.contract.md
#   - specs/311-maestro-matrix-model-b-clean-vs-na/contracts/cross-surface-consistency.contract.md
#   - tests/scripts/test_maestro_coverage_invariant.py (the 7-layer invariant)
#   - tests/scripts/test_maestro_cross_surface_consistency.py (the cross-surface gate)
#   - scripts/tachi_parsers.py:MAESTRO_LAYERS + classify_maestro_coverage_state (canonical sources of truth)
# =============================================================================

name: tachi maestro coverage

on:
  pull_request:
    paths:
      # --- regression-necessary: a change here can alter a committed example matrix,
      #     OR a cross-surface render-IR coverage_state the consistency test
      #     re-extracts at test time (Architect LOW-A — the extractors/templates/
      #     orchestrator author or parse the MAESTRO state the cross-surface gate
      #     re-derives, so a change here CAN flip a test outcome; the last three
      #     entries were previously defense-in-depth-only and are now promoted) ---
      - tests/scripts/test_maestro_coverage_invariant.py
      - tests/scripts/test_maestro_cross_surface_consistency.py
      - examples/**/threats.md
      - scripts/tachi_parsers.py                       # MAESTRO_LAYERS + classify_maestro_coverage_state
      - scripts/populate-maestro-coverage.py           # the tool that rewrites example tables
      - scripts/extract-report-data.py                 # PDF coverage_state IR (re-extracted by the consistency test)
      - scripts/extract-infographic-data.py            # infographic coverage_state IR (re-extracted by the consistency test)
      - templates/tachi/security-report/maestro-findings.typ      # PDF clean/n-a render branch
      - templates/tachi/infographics/infographic-maestro-stack.md # infographic clean/n-a band
      - .claude/agents/tachi/orchestrator.md           # Section-6 clean/n-a token authority (FR-002 / ADR-047 D1)
      - .github/workflows/tachi-maestro-coverage.yml

permissions:
  contents: read

jobs:
  maestro-coverage-invariant:
    name: Verify all 7 MAESTRO layers present in example tables
    # Single OS — the invariant is a markdown-glob assertion, OS-independent.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest + PyYAML
        # PyYAML is required at pytest *collection* time: tests/scripts/conftest.py
        # imports `yaml` at module scope, and BOTH test modules below collect
        # through it. Without pyyaml, pytest aborts at conftest import with
        # `ModuleNotFoundError: No module named 'yaml'` (exit 4) before any test
        # runs. Mirrors the pinned install in tachi-pytest.yml (the canonical repo
        # pattern). The gap was latent from F-315 (the job never actually fired on
        # #316); F-311 is the first PR to exercise this job, so the fix lands here.
        run: pip install 'pytest>=8' 'pytest-timeout>=2' 'pyyaml>=6'

      # Direct pytest invocation — slash commands cannot run in CI. The invariant
      # test discovers the example corpus dynamically and asserts no canonical
      # L1-L7 layer is missing from any MAESTRO table; the cross-surface test
      # re-extracts the PDF + infographic render IR for examples/microservices and
      # asserts the three surfaces agree on every layer's coverage_state (naming
      # the offending layer ID + divergent surface on failure). Keep BOTH modules
      # here in lock-step with the `paths:` list above (F-250 rule).
      - name: Run MAESTRO 7-layer coverage invariant + cross-surface consistency
        run: |
          python3 -m pytest \
            tests/scripts/test_maestro_coverage_invariant.py \
            tests/scripts/test_maestro_cross_surface_consistency.py \
            -v
