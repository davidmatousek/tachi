# =============================================================================
# tachi maestro coverage gate — MAESTRO 7-layer invariant (F-315 US-3 / #313)
# =============================================================================
#
# Purpose: Durably lock the F-098 guarantee that every shipped example
# `threats.md` carrying a "Risk by MAESTRO Layer" distribution table presents
# ALL SEVEN canonical MAESTRO layers (L1-L7) as rows. Runs the existing
# invariant test on every PR that touches the MAESTRO author/parse surface.
# On a <7-row regression the test exits non-zero and NAMES the missing
# layer ID(s), so the failure is self-explaining in the PR checks UI.
#
# Dedicated single-concern job (plan.md Decision A) — modeled on the
# tachi-mmdc-preflight.yml file precedent. Deliberately NOT folded into
# tachi-pytest.yml: that job is a bash-compatibility matrix (macOS + ubuntu)
# and broadening its tightly-scoped trigger would risk NFR-4 cross-firing.
# The invariant is a markdown-glob assertion — OS-independent, single runner.
#
# F-250 lock-step rule: any future addition to the MAESTRO test set or
# example-author surface MUST update BOTH the `paths:` list below AND the
# pytest invocation in the same commit.
#
# References:
#   - specs/315-maestro-output-completeness-round-2/plan.md (Decision A + E)
#   - specs/315-maestro-output-completeness-round-2/contracts/tachi-maestro-coverage-ci.contract.md
#   - tests/scripts/test_maestro_coverage_invariant.py (the invariant)
#   - scripts/tachi_parsers.py:MAESTRO_LAYERS (canonical layer source of truth)
# =============================================================================

name: tachi maestro coverage

on:
  pull_request:
    paths:
      # --- regression-necessary: a change here can alter a committed example matrix ---
      - tests/scripts/test_maestro_coverage_invariant.py
      - examples/**/threats.md
      - scripts/tachi_parsers.py                       # MAESTRO_LAYERS (canonical layer list)
      - scripts/populate-maestro-coverage.py           # the tool that rewrites example tables
      - .github/workflows/tachi-maestro-coverage.yml
      # --- defense-in-depth (optional): author/parse the PRODUCTION matrix; cannot change a committed example ---
      - scripts/extract-report-data.py
      - .claude/agents/tachi/orchestrator.md
      - templates/tachi/security-report/maestro-findings.typ

permissions:
  contents: read

jobs:
  maestro-coverage-invariant:
    name: Verify all 7 MAESTRO layers present in example tables
    # Single OS — the invariant is a markdown-glob assertion, OS-independent.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest pytest-timeout

      # Direct pytest invocation — slash commands cannot run in CI. The test
      # discovers the example corpus dynamically and, for each file carrying a
      # MAESTRO table, asserts no canonical L1-L7 layer is missing (naming any
      # absent layer ID on failure). Keep this invocation in lock-step with the
      # `paths:` list above (F-250 rule).
      - name: Run MAESTRO 7-layer coverage invariant
        run: python3 -m pytest tests/scripts/test_maestro_coverage_invariant.py -v
