# =============================================================================
# tachi init matrix — Rust shell hardening + active-doc guard
# =============================================================================
#
# Purpose: Run the Rust-native successors for the init.sh hardening surface on
# a 2-runner cross-platform matrix so we still catch bash-version regressions:
#
#   - macos-latest ships bash 3.2.57 (Apple's bundled /bin/bash). This is the
#     OLDEST supported runtime and the strictest gate for compatibility
#     constraints in `.aod/scripts/bash/template-substitute.sh`,
#     `.aod/scripts/bash/init-input.sh`, `.aod/scripts/bash/template-git.sh`,
#     and `.aod/scripts/bash/template-config-load.sh`.
#
#   - ubuntu-latest ships bash 5.x. This is the modern reference shell; a
#     green ubuntu run on top of a green macOS run proves the suite is portable,
#     not bash-3.2-quirk-locked.
#
# The workflow:
#   1. Checks out the repo at the PR head SHA
#   2. Sets up the stable Rust toolchain
#   3. Asserts `bash --version` to make the matrix gate visible in logs
#   4. Runs the Rust init + doc guard suites
#      matrix
#   5. Both matrix legs MUST pass green
#
# Path filter (scope discipline): the workflow ONLY fires when files in the
# remaining init hardening surface change. Pure docs edits, ADR text, or
# unrelated agent-tier changes do NOT trigger this job.
#
# References:
#   - docs/architecture/02_ADRs/ADR-038-placeholder-substitution-strategy.md
#   - docs/architecture/02_ADRs/ADR-040-config-file-parsing-hardening.md
#   - docs/standards/PUBLISHING_SECURITY.md
# =============================================================================

name: tachi init matrix

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/init.sh
      - .aod/scripts/bash/init-input.sh
      - .aod/scripts/bash/template-substitute.sh
      - .aod/scripts/bash/template-validate.sh
      - .aod/scripts/bash/template-git.sh
      - .aod/scripts/bash/template-config-load.sh
      - .aod/templates/constitution-clean.md
      - .aod/templates/constitution-instructional.md
      - .aod/template-manifest.txt
      - stacks/*/defaults.env
      - crates/tachi-shell/tests/init_substitution.rs
      - crates/tachi-shell/tests/init_constitution.rs
      - crates/tachi-shell/tests/init_defaults_env.rs
      - crates/tachi-shell/tests/init_precommit_matrix.rs
      - crates/tachi-shell/tests/init_timing_trace.rs
      - crates/tachi-shell/tests/init_trace_summary.rs
      - crates/tachi-core/tests/active_docs_runtime_guidance.rs
      - docs/architecture/00_Tech_Stack/README.md
      - README.md
      - docs/standards/CLAUDE_MD_ORGANIZATION.md
      - docs/standards/CLAUDE_PERMISSIONS.md
      - docs/standards/PRECOMMIT_HOOKS.md
      - docs/standards/EVAL_CONVENTIONS.md
      - docs/guides/SMOKE_TEST.md
      - .github/workflows/*.yml

permissions:
  contents: read

jobs:
  init-suite:
    name: Rust init suite — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Diagnostic — bash version (compatibility gate)
        run: |
          echo "uname: $(uname -a)"
          echo "/bin/bash --version: $(/bin/bash --version | head -1)"
          echo "default bash --version: $(bash --version | head -1)"

      - name: Run Rust init suite
        run: |
          cargo test -q -p tachi-shell --test init_substitution
          cargo test -q -p tachi-shell --test init_constitution
          cargo test -q -p tachi-shell --test init_defaults_env
          cargo test -q -p tachi-shell --test init_precommit_matrix
          cargo test -q -p tachi-shell --test init_timing_trace
          cargo test -q -p tachi-shell --test init_trace_summary
          cargo test -q -p tachi-core --test active_docs_runtime_guidance active_docs_do_not_instruct_running_retired_python_entrypoints
