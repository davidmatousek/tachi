name: rust workspace tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-test:
    name: cargo test --workspace --all-targets
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install workspace test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep libglib2.0-dev libgtk-3-dev libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev pkg-config

      - name: Run full workspace test suite
        run: cargo test --workspace --all-targets
