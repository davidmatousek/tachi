# NIST AI 600-1 Catalog (taxonomy: nist-ai-600-1)
#
# Composition: NIST AI 600-1 "Artificial Intelligence Risk Management
# Framework: Generative Artificial Intelligence Profile" (July 2024),
# Section 2 Generative AI risks — exactly 12 records, §§2.1–2.12.
#
# Source: transcribed verbatim from the Surface C table of
# `.claude/skills/tachi-shared/references/nist-ai-rmf-mapping.md`
# (the in-repo verbatim source surface per the F-184 build contract C1).
# Retrieval/verification date: 2026-06-10.
#
# Record shape: {id, full_id, name, url, cwe_refs}.
# `cwe_refs: []` for all records — NIST AI 600-1 publishes no direct CWE
# cross-references; any AI-600-1<->CWE relationships belong in
# crosswalk.yaml, never inline here.
#
# IDs are YAML-QUOTED strings ("2.1" … "2.12") — the quoting is
# load-bearing: an unquoted `2.10` float-coerces to `2.1`, colliding with
# §2.1 and silently corrupting referential integrity. Every id in this
# file (and every crosswalk edge endpoint targeting this taxonomy) MUST
# remain quoted.
#
# `full_id` format: `NIST AI 600-1 §<id>` (e.g., `NIST AI 600-1 §2.9`).
#
# URL: every record shares the NIST DOI
# `https://doi.org/10.6028/NIST.AI.600-1` (the DOI resolves to the
# document containing all 12 §2 risk subsections; per-section anchors are
# not stable across NIST publication revisions).
#
# Sorted in NIST publication order: §2.1 → §2.12, section-numeric — NOT
# lexicographic, which would misplace "2.10"–"2.12" before "2.2". The
# integrity suite enforces this ordering via `_sort_key_section`.
#
# KNOWN DIVERGENCE (documented, not corrected here): NIST's AI 600-1 PDF
# titles §2.6 "Harmful Bias and Homogenization"; the in-repo Surface C
# table says "Harmful Bias or Homogenization". This file follows the
# table ("or"); the or/and observation routes with the OQ-4 ADR-025
# amendment note at delivery — never a silent edit here.
#
# FR-024 transcription discipline: this catalog is a verbatim
# transcription of the cited source surface, not a re-authorship. Factual
# corrections route to the source table / ADR-025 amendment process,
# never unilaterally into this file.

