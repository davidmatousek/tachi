[package]
name = "tachi-core"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
proptest = "1"
pretty_assertions = "1"
regex = "1"
rstest = "0.24"
serde_yaml = "0.9"
