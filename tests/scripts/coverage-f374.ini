# Coverage gate for F-374's new and rewritten shipped scripts (ADR-050 D16, the 2026-11-22 amendment).
# Constitution VI and VII ask for at least 80% unit coverage of business logic.
#
# Only the `f374-offline` job of .github/workflows/tachi-install-fidelity.yml uses this file. It runs
#
#   python3 -m pytest --cov --cov-config=tests/scripts/coverage-f374.ini --cov-report=term-missing <modules> -v
#
# pytest-cov reads `fail_under` and `precision` from [report], so a gated set below 80% fails the job.
#
# Only in-process runs count (H15). The gated tests load each entry through tests/conftest.py's
# `_load_hyphenated_script` and call its `main(argv)`, so pytest-cov measures it in the test process. A
# subprocess run shows nothing here, and coverage's subprocess support is not switched on: its child processes
# could write `.coverage.*` files into the tree under test.
#
# Lock-step (KB 3): a module joins `include` in the commit that wires it into the job, and this file is in the
# workflow's `paths:`. W1 wired tachi_parts.py, tachi_scoring.py, sarif_common.py and tachi-stage.py, W2 added
# tachi_scoring_rules.py and render-risk-scores.py, and W3 (T039) added render-compensating-controls.py. PR 2's
# W2' (T114) adds join-threats-md.py, attack-chains.py, assemble-report.py and the rewritten generate-threats-sarif.py,
# and its W3' (T098) adds check-threat-model.py.
#
# tachi_parsers.py is not in the set. It is extended, not new, and its legacy code would set most of its figure,
# so it is held to a ratchet instead: the job repeats test_tachi_parsers.py's coverage and fails below the floor
# that T001 recorded in specs/374-large-architecture-pipeline-resilience/test-results/prestate.md.

[run]
# `source` makes a gated module that no test runs count at 0%, instead of dropping out of the total.
source = scripts

[report]
include =
    scripts/tachi_parts.py
    scripts/tachi_scoring.py
    scripts/sarif_common.py
    scripts/tachi-stage.py
    scripts/tachi_scoring_rules.py
    scripts/render-risk-scores.py
    scripts/render-compensating-controls.py
    scripts/join-threats-md.py
    scripts/attack-chains.py
    scripts/assemble-report.py
    scripts/generate-threats-sarif.py
# Total line coverage over the set above.
fail_under = 80
# The total is compared to 80 after rounding to this many places, so 79.6 does not round up to a pass.
precision = 2
