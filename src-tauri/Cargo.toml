[package]
name = "tachi-tauri"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sha2 = "0.10"
serde_json = "1"
tauri = { version = "2.6.3", features = ["config-json5"] }
tachi-shell = { path = "../crates/tachi-shell" }

[build-dependencies]
tauri-build = { version = "2.6.3", features = ["config-json5"] }

[dev-dependencies]
pretty_assertions = "1"
serde_json = "1"
